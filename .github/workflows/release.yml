name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          build_script_override: scripts/build-release.sh

      # install.sh refuses binaries without checksums.txt; fail the release
      # loudly if the upload ever stops including it.
      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-checksums.sh "${{ github.ref_name }}"
